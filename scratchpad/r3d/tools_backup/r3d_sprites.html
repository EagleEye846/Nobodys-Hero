</pre><script type="module">
const r=document.getElementById('report');

 r.textContent+=names.map(n=>{const s=m.PROP_SPRITES[n];const a=Array.isArray(s)?s:(s.rows??s.frames?.[0]??[]);return `${n} ${a[0]?.length??'?'}x${a.length}`}).join('\n')+'\n';
