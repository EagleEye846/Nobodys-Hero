<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The game's modules and text load relative to the page, so act as if we're in the game's folder. -->
<base href="../">
<title>Nobody's Hero: Trailer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; image-rendering: pixelated; }
  body.playing { cursor: none; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 26px 'VT323', monospace; color: #ffcc66; }
  #start h1 { font-weight: normal; font-size: 72px; margin: 0; }
  #start p { color: #9a90b3; margin: 0; font-size: 22px; max-width: 760px; text-align: center; line-height: 1.3; }
  #start button { font: 30px 'VT323', monospace; background: #ffcc66; color: #1a0d00; border: 0; padding: 8px 26px; cursor: pointer; }
  #start button:disabled { opacity: 0.4; cursor: wait; }
  #start button.ghost { background: transparent; color: #ffcc66; border: 2px solid #ffcc66; }
  #status { position: absolute; left: 12px; bottom: 10px; font: 20px 'VT323', monospace; color: #9a90b3; }
  #report { position: absolute; left: 12px; top: 10px; margin: 0; font: 18px monospace; color: #ff8080; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="trailer" width="3840" height="2160"></canvas>
<div id="start">
  <h1>NOBODY'S HERO: TRAILER</h1>
  <p>Press F11 for full screen first. "Play" just plays it. "Export video" makes the file for
     YouTube: 4K, 60 frames a second, rendered frame by frame (no dropped frames), with the song.
     It takes a few minutes and saves nobodys-hero-trailer.webm to your Downloads.</p>
  <div><button id="play" disabled>Play</button> <button id="export" class="ghost" disabled>Export video</button></div>
</div>
<div id="status"></div>
<pre id="report"></pre>
<script>
  // Anything that goes wrong shows on the page (and tools/headless.py reads it).
  const show = (m) => { document.getElementById('report').textContent += `
ERROR: ${m}`; };
  window.addEventListener('error', (e) => show(`${e.message} (${e.filename}:${e.lineno})`));
  window.addEventListener('unhandledrejection', (e) => show(e.reason?.stack ?? e.reason));
</script>
<script type="module">
// The "Nobody's Hero" trailer, for chapters 1 and 2: live scenes from the
// game, cut on the beat of "Nobody Came" (src/data/music/trailerTheme.js).
// Everything that happens is in TEXT and SHOTS below, timed in bars of the
// song (one bar is 1.875 seconds at 128 BPM; 20.5 means half way through
// bar 20). The machine that plays and exports it is tools/trailerKit.js;
// the chapter 3 trailer (trailer3.html) runs on the same one. Change the
// words, swap rooms or enemies, and refresh.
//
// For checking without sound: ?at=41 draws the moment 41 seconds in and stops.
// ?seconds=5 makes Export video do only the first 5 seconds.
import { runTrailer } from './tools/trailerKit.js';
import { SONGS } from './src/data/music/index.js';
import { WORLD_STATE } from './src/state/saveGame.js';
import { giveGear } from './src/data/gear.js';

// --- The words. `line` is white text on black; `voice` is the game's text
// box (someone in the world talking: the hero never speaks); `big` is one
// large line on black; `caption` sits along the bottom over the picture.
// `from`/`to` are bars.
const TEXT = [
  { from: 0.5, to: 2.0, line: 'A lantern, still burning.' },
  { from: 2.25, to: 3.75, line: 'A stairway, still empty.' },
  { from: 4.25, to: 5.9, voice: 'Is it... the Hero?' },
  { from: 6.0, to: 7.9, voice: "No. It's nobody." },
  { from: 10.2, to: 15.2, caption: 'A game inspired by Undertale, Chrono Trigger, and Earthbound' },
  { from: 19.5, to: 20, big: 'NOBODY CAME.' },
  { from: 36.25, to: 37.9, line: 'Somewhere, a lantern has gone out.' },
  { from: 38.1, to: 39.9, voice: "Then who's going to save us?" },
];

// --- The shots, each from bar `from` until the next one starts.
//   room      that room, the hero standing `at` a tile (facing `facing`), at
//             a time of `day` (0 sunrise, 0.5 sunset, 0.75 midnight), with
//             Ves following if `ves`. `script` is a list of cutscene steps,
//             and `actors` the people in it (as in src/data/scenes/). `pre`
//             seconds of it have already happened when we cut to it.
//             Scripted walks go through anything (and the monsters stand
//             still), so route them clear. `keys` instead plays the shot on
//             the real controls, through the real physics: a list of moves,
//             each holding some keys (`hold`) and pressing others as it
//             starts (`press`), until `seconds` pass or `until(player)` is
//             true. For jumping onto blocks and pulling levers. A `swing`
//             move plays a rope climb: pumping the swing, and flinging to
//             the next ring at the right moment.
//             `ride` instead rides the room's first wind geyser; `vision`
//             shows one of the dream pictures (src/overworld/visions.js).
//   battle    that enemy, mid-attack (`stage` for a boss's phase, `ves` for
//             her in the party, `pattern` for one attack, else its busiest).
//             `fight` instead starts on the hero's turn: he lands a slash
//             and the enemy answers. `weapon` equips one (src/data/weapons.js),
//             and its SHIFT ability gets used whenever a bullet comes close.
//   shop      that shop (src/data/shops.js), the keeper talking, then BUY.
//   black     nothing; `title` is the title card.
const SHOTS = [
  { from: 0, black: true },

  // The calm: slow, still places.
  // Running up the hall, jumping up the blocks in the corner, and pulling
  // the lever: the gate grinds open.
  { from: 8, room: 'pillar_room', at: { x: 12, y: 13 }, facing: 'up', pre: 0.5,
    keys: [
      { hold: ['up', 'cancel'], until: (p) => p.y <= 96 },
      { hold: ['right', 'cancel'], until: (p) => p.x >= 248 },
      { press: ['jump'], hold: ['up'], until: (p) => p.ground >= 12 && !p.isAirborne },
      { press: ['jump'], hold: ['up'], until: (p) => p.ground >= 24 && !p.isAirborne },
      { hold: ['right'], until: (p) => p.x >= 264 },
      { seconds: 0.25 },
      { press: ['confirm'], seconds: 9 },
    ] },
  { from: 10, room: 'flower_room', at: { x: 10, y: 12 }, facing: 'up',
    script: [{ do: 'walk', who: 'player', to: { x: 10, y: 8 } }, { do: 'face', who: 'player', dir: 'up' }] },
  { from: 12, room: 'rest_chapel', at: { x: 7, y: 14 }, facing: 'up',
    script: [{ do: 'walk', who: 'player', to: { x: 7, y: 8 } }, { do: 'face', who: 'player', dir: 'up' }] },
  { from: 14, room: 'rest_square', at: { x: 12, y: 18 }, facing: 'right', day: 0.5,
    script: [{ do: 'walk', who: 'player', to: { x: 22, y: 18 } }] },
  // The stores: the keeper's greeting, then the wares.
  { from: 15, shop: 'rest_stores', pre: 0.3, presses: [0.9, 1.5] },

  // The build: climbing, faster and faster.
  // The rope: thrown up to the ring, and hauled up the cliff.
  { from: 16, room: 'climb_start', at: { x: 12, y: 13 }, facing: 'up', ves: true, pre: 0.4,
    keys: [
      { hold: ['up', 'cancel'], until: (p) => p.y <= 176 },
      { seconds: 0.15 },
      { press: ['confirm'], seconds: 9 },
    ] },
  // Into the ice caves.
  { from: 17, room: 'ice_cave_hall', at: { x: 3, y: 15 }, facing: 'right', ves: true,
    script: [{ do: 'walk', who: 'player', to: { x: 13, y: 15 }, fast: true }] },
  // Up a wind geyser, hanging off Ves's boot.
  { from: 17.75, room: 'vigil_second_cairn', at: { x: 7, y: 16 }, ves: true, ride: true, pre: 0.5 },
  // Round the spire: the mountain turns under them.
  { from: 19, room: 'vigil_spiral', at: { x: 24, y: 16 }, facing: 'right', ves: true,
    script: [{ do: 'walk', who: 'player', to: { x: 41, y: 16 }, fast: true }] },
  { from: 19.5, black: true },

  // THE DROP: a fight on every bar, and the weapons' abilities.
  { from: 20, battle: 'taper', area: 'taper_stand' },
  { from: 21, battle: 'columneon', weapon: 'ash_spear' },
  { from: 22, battle: 'duskling', fight: true },
  { from: 24, battle: 'waxling', weapon: 'old_shield' },
  { from: 25, battle: 'bunny', weapon: 'iron_gauntlets' },
  // The weathervanes: two quarter turns, and the wind swings round to blow
  // right; then a whirlwind flings them clear across the gap.
  { from: 26, room: 'vigil_weathervanes', at: { x: 4, y: 13 }, facing: 'up', ves: true, pre: 0.3,
    keys: [
      // Up until the vane stops him, so it's in reach.
      { hold: ['up'], until: (p) => p.y <= 200 },
      // Two quarter turns: the wind starts blowing left; now it blows right.
      { press: ['confirm'], seconds: 0.3 },
      { press: ['confirm'], seconds: 0.3 },
      { hold: ['left'], until: (p) => p.x <= 40 },
      { seconds: 9 },
    ] },

  // The rise: the mountain's fights, and the man at the top.
  { from: 28, battle: 'craghorn', ves: true, fight: true },
  // (the swing takes over at 29.5)
  // The sheer face: the rope hooks the lowest ring, and he swings ring to
  // ring up the cliff, flinging himself across at the top of each swing.
  { from: 29.5, room: 'sheer_face', at: { x: 10, y: 23 }, facing: 'up', ves: true, pre: 4.6,
    keys: [
      { hold: ['up'], until: (p) => p.y <= 368 },
      { press: ['confirm'], seconds: 0.2 },
      { swing: true, until: (p, scene) => !scene.climb && p.y < 300 },
      { seconds: 9 },
    ] },
  // He sweeps his arm, and the storm stops.
  { from: 32, room: 'vigil_summit', at: { x: 15, y: 14 }, facing: 'up', ves: true, pre: 0.6,
    actors: [{ id: 'usurper', look: 'anim:usurper_brood', x: 20, y: 5, animation: 'usurper_brood', speed: 0.6 }],
    script: [
      { do: 'camera', to: { x: 19, y: 8 } },
      { do: 'animate', who: 'usurper', animation: 'usurper_swish', speed: 0.3, once: true },
      { do: 'wait', seconds: 0.5 },
      { do: 'weather', to: 0, seconds: 1.3 },
      { do: 'wait', seconds: 3 },
    ] },
  { from: 33, battle: 'great_bat', area: 'cave', ves: true },
  // He throws her lantern down, and comes at you.
  { from: 34, room: 'vigil_summit', at: { x: 15, y: 14 }, facing: 'up', ves: true, pre: 1.4,
    actors: [
      { id: 'usurper', look: 'anim:usurper_idle', x: 20, y: 5, animation: 'usurper_idle', speed: 0.3 },
      { id: 'lantern', look: 'anim:usurper_lantern', x: 19, y: 5, hidden: true, animation: 'usurper_lantern', speed: 0.07 },
    ],
    script: [
      // The storm has already stopped.
      { do: 'weather', to: 0, seconds: 0 },
      { do: 'camera', to: { x: 18, y: 9 } },
      { do: 'animate', who: 'usurper', animation: 'usurper_toss', speed: 0.16, once: true },
      { do: 'wait', seconds: 0.45 },
      { do: 'appear', who: 'lantern', at: { x: 19, y: 4 } },
      { do: 'toss', who: 'lantern', to: { x: 17, y: 10 }, height: 36, bounces: 2 },
      { do: 'animate', who: 'usurper', animation: 'usurper_empty', speed: 0.3 },
      { do: 'wait', seconds: 0.15 },
      { do: 'animate', who: 'usurper', animation: 'usurper_charge', speed: 0.1 },
      { do: 'walk', who: 'usurper', to: { x: 15, y: 12 }, fast: true, keep: true },
      { do: 'wait', seconds: 2 },
    ] },
  { from: 35.5, battle: 'usurper', area: 'summit', ves: true, stage: 2 },

  // The hush: the fall, reaching for her.
  { from: 36, room: 'lantern_hall', vision: { name: 'fall', mood: 'reach' } },
  { from: 38, black: true },

  // NOBODY'S HERO
  { from: 40, title: true },
  { from: 44, black: true },
];
const END = 44.6;

// Big hits: a white flash and a shake. Every cut in the drop and rise gets a
// small flash too.
const HITS = [20, 28, 40];

runTrailer({
  bpm: 128,
  song: SONGS.trailer,
  end: END,
  text: TEXT,
  shots: SHOTS,
  hits: HITS,
  // Every cut in the drop and rise gets a small flash too.
  flashes: [20, 36],
  title: { at: 40, name: "NOBODY'S HERO", sub: 'CHAPTERS 1 & 2', subAt: 41.5, to: 44 },
  filename: 'nobodys-hero-trailer.webm',
  setup() {
    WORLD_STATE.metShadow = true;
    WORLD_STATE.turnedVane = true;
    // Ves has taken the hero's hand (vesHoldsYourHand.js), so the rides are hand in hand.
    WORLD_STATE.seenScenes = ['ves_holds_your_hand'];
    giveGear('climbing_rope');
  },
});
</script>
</body>
</html>
