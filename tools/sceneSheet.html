<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<title>Scene Sheet</title>
<style>
  body { background: #000; color: #e8e4f4; font: 12px monospace; margin: 0; }
  canvas { display: block; }
  #report { padding: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="sheet" width="1440" height="720"></canvas>
<div id="report"></div>
<script>
  const show = (m) => { document.getElementById('report').textContent += `\nERROR: ${m}`; };
  window.addEventListener('error', (e) => show(`${e.message} (${e.filename}:${e.lineno})`));
  window.addEventListener('unhandledrejection', (e) => show(e.reason?.stack ?? e.reason));
  // A clock the page owns, so a scene can be run faster than real time.
  window.simNow = 1000;
  performance.now = () => window.simNow;
  // A busy server drops a request now and then: ask again.
  const realFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    for (let tries = 0; ; tries++) {
      try { return await realFetch(...args); } catch (e) { if (tries >= 6) throw e; await new Promise((done) => setTimeout(done, 300 * (tries + 1))); }
    }
  };
</script>
<script type="module">
// A contact sheet of a cutscene: ?scene=<id>&steps=3,10,25&x=&y=&seen=a,b&with=vesper
// Plays the scene in fast simulated time (pressing through text) and draws the
// screen at each of those steps into one picture (up to 6). For checking a
// scene's staging without waiting for it in real time.
//   python tools/headless.py "http://localhost:8000/tools/sceneSheet.html?scene=tuck_finds_you&steps=1,9,40" 120 sheet.png
import { UI_WIDTH, UI_HEIGHT, UI_SCALE } from './src/config.js';
import { createScreen } from './src/engine/screen.js';
import { loadUiFont } from './src/ui/text.js';
import { loadTextFiles } from './src/engine/textLoader.js';
import { TEXT_FILES } from './src/data/textManifest.js';
import { OverworldScene } from './src/overworld/overworldScene.js';
import { ROOMS } from './src/data/rooms/index.js';
import { SCENES } from './src/data/scenes/index.js';
import { joinParty, setHurt } from './src/characters/party.js';
import { WORLD_STATE } from './src/state/saveGame.js';

const params = new URLSearchParams(location.search);
const report = document.getElementById('report');
const sheet = document.getElementById('sheet');
const sctx = sheet.getContext('2d');
sctx.fillStyle = '#000';
sctx.fillRect(0, 0, sheet.width, sheet.height);
await Promise.all([loadUiFont(), loadTextFiles(TEXT_FILES)]);

const noInput = { isDown: () => false, wasPressed: () => false, endFrame() {} };
const press = { isDown: (a) => a === 'confirm', wasPressed: (a) => a === 'confirm', endFrame() {} };
const sceneData = SCENES[params.get('scene')];
if (!sceneData) throw new Error(`No scene '${params.get('scene')}'`);
for (const id of (params.get('with') ?? 'vesper').split(',').filter(Boolean)) joinParty(id);
for (const id of (params.get('hurt') ?? '').split(',').filter(Boolean)) setHurt(id, true);
if (params.get('seen')) WORLD_STATE.seenScenes = params.get('seen').split(',');
const roomData = ROOMS[params.get('room') ?? sceneData.room];
const at = params.has('x') ? { x: Number(params.get('x')), y: Number(params.get('y')) } : roomData.playerStart;
let scene = new OverworldScene(roomData, at, roomData.area);
const game = {
  home: null,
  changeScene(next) { report.textContent += `SCENE LEFT FOR ${next?.roomData?.id ?? next?.constructor?.name}\n`; if (next instanceof OverworldScene) { scene = next; scene.enter?.(game); } },
};
scene.enter?.(game);
scene.npcs = [];
scene.playCutscene(sceneData);

const steps = (params.get('steps') ?? '0').split(',').map(Number);
const wait = Number(params.get('after') ?? 0.5);
const shotCtx = createScreen(document.createElement('canvas'), UI_WIDTH, UI_HEIGHT);
const DT = 1 / 30;
let t = 0;
let open = 0;
let next = 0;
let reachedAt = null;
const cols = 3;
const w = 480;
const h = 360;
function shot(label) {
  shotCtx.setTransform(1, 0, 0, 1, 0, 0);
  shotCtx.fillStyle = '#000';
  shotCtx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  shotCtx.setTransform(UI_SCALE, 0, 0, UI_SCALE, 0, 0);
  scene.draw(shotCtx);
  const k = next;
  sctx.drawImage(shotCtx.canvas, (k % cols) * w, Math.floor(k / cols) * h, w, h);
  sctx.fillStyle = '#000';
  sctx.fillRect((k % cols) * w, Math.floor(k / cols) * h, 360, 13);
  sctx.fillStyle = '#ff0';
  sctx.font = '11px monospace';
  sctx.fillText(label, (k % cols) * w + 3, Math.floor(k / cols) * h + 10);
  next++;
}
let frames = 0;
while (next < steps.length && frames < 30 * 60 * 15) {
  frames++;
  if (frames % 300 === 0) {
    report.textContent = `running: frame ${frames}, step ${scene.cutscene?.index}, shots ${next}
`;
    await new Promise((done) => setTimeout(done, 0));
  }
  t += DT;
  window.simNow += DT * 1000;
  if (scene.textbox.isOpen) open += DT; else open = 0;
  const i = scene.cutscene ? scene.cutscene.index : 1e9;
  if (reachedAt === null && i >= steps[next]) reachedAt = t;
  if (reachedAt !== null && t - reachedAt >= wait) {
    const st = sceneData.steps[steps[next]];
    shot(`${sceneData.id} step ${steps[next]} ${st?.do ?? ''} ${st?.who ?? ''}`);
    reachedAt = null;
    // The same step may satisfy the next one too; let a frame go by.
    continue;
  }
  let input = noInput;
  if (scene.textbox.isOpen && open > 0.3) { input = press; open = 0; }
  scene.update(DT, input);
  if (!scene.cutscene && scene.constructor !== OverworldScene) break;
  if (!scene.cutscene && next < steps.length && reachedAt === null && i === 1e9) {
    // The scene is over (or left): take what's left as the last shots.
    while (next < steps.length) shot(`${sceneData.id} (over; wanted step ${steps[next]})`);
  }
}
report.textContent += `SHEET DONE ${params.get('scene')} frames=${frames} t=${t.toFixed(0)}s`;
</script>
</body>
</html>
