<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The game's modules and text load relative to the page, so act as if we're in the game's folder. -->
<base href="../">
<title>Nobody's Hero: Chapter 4 Trailer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; image-rendering: pixelated; }
  body.playing { cursor: none; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 26px 'VT323', monospace; color: #ffcc66; }
  #start h1 { font-weight: normal; font-size: 72px; margin: 0; }
  #start p { color: #9a90b3; margin: 0; font-size: 22px; max-width: 760px; text-align: center; line-height: 1.3; }
  #start button { font: 30px 'VT323', monospace; background: #ffcc66; color: #1a0d00; border: 0; padding: 8px 26px; cursor: pointer; }
  #start button:disabled { opacity: 0.4; cursor: wait; }
  #start button.ghost { background: transparent; color: #ffcc66; border: 2px solid #ffcc66; }
  #status { position: absolute; left: 12px; bottom: 10px; font: 20px 'VT323', monospace; color: #9a90b3; }
  #report { position: absolute; left: 12px; top: 10px; margin: 0; font: 18px monospace; color: #ff8080; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="trailer" width="3840" height="2160"></canvas>
<div id="start">
  <h1>CHAPTER 4: THE FIRST</h1>
  <p>Press F11 for full screen first. "Play" just plays it. "Export video" makes the file for
     YouTube: 4K, 60 frames a second, rendered frame by frame (no dropped frames), with the song.
     It takes a few minutes and saves nobodys-hero-chapter-4.webm to your Downloads.</p>
  <div><button id="play" disabled>Play</button> <button id="export" class="ghost" disabled>Export video</button></div>
</div>
<div id="status"></div>
<pre id="report"></pre>
<script>
  // Anything that goes wrong shows on the page (and tools/headless.py reads it).
  const show = (m) => { document.getElementById('report').textContent += `
ERROR: ${m}`; };
  window.addEventListener('error', (e) => show(`${e.message} (${e.filename}:${e.lineno})`));
  window.addEventListener('unhandledrejection', (e) => show(e.reason?.stack ?? e.reason));
</script>
<script type="module">
// The chapter 4 trailer: the fall into the buried kingdom, cut on the beat of
// "Once, Somebody Came" (src/data/music/trailerFirstTheme.js). No spoilers:
// Sunnyside, the Glimmering, Belowtown and its folk, the mines, the
// Stillwater, the Deep (only its dark), a few fights, and the king as the
// grand showman he is in his first fight; nothing past that. Everything that
// happens is in TEXT and SHOTS below, timed in bars of the song (one bar is
// exactly 2 seconds at 120 BPM; 12.5 means half way through bar 12). The
// machine that plays and exports it is tools/trailerKit.js, shared with
// trailer.html and trailer3.html. Change the words, swap rooms or enemies,
// and refresh.
//
// For checking without sound: ?at=30 draws the moment 30 seconds in and stops.
// ?strip=30,1,8 tiles 8 frames, one a second from 30s. ?seconds=5 makes
// Export video do only the first 5 seconds.
import { runTrailer } from './tools/trailerKit.js';
import { SONGS } from './src/data/music/index.js';
import { HERO_STATE } from './src/characters/heroState.js';
import { WORLD_STATE } from './src/state/saveGame.js';

// The song's shape, in bars: sunny 0, crack 7, fall 8, glimmer 10, town 16,
// mines 20, hush 24 (the lake, then the dark), build 28 (silence 31.75),
// drop 32, finale 40 (title 44), tag 48, end 50.

// --- The words. `line` is white text on black; `big` is one large line on
// black; `caption` sits along the bottom over the picture. Everything else
// anyone says is the game's own scenes talking. `from`/`to` are bars.
const TEXT = [
  { from: 10.4, to: 15.6, caption: 'Chapter 4: a whole kingdom, buried' },
  { from: 17.3, to: 19.9, caption: 'Belowtown: a whole town under the world' },
  { from: 30.1, to: 31.4, line: 'Down here, they remember a hero.' },
  { from: 31.45, to: 31.95, line: 'The first one.' },
];

// --- The shots, each from bar `from` until the next one starts. `scene`
// plays one of the game's own cutscenes, from `pre` seconds in; walks are
// routed along the rooms' real paths; `party` is who's with the hero.
const VES = ['vesper'];
const walk = (x, y) => [
  { hold: ['right', 'cancel'], until: (p) => p.x >= x * 16 + 8 },
  { hold: ['down', 'cancel'], until: (p) => p.y >= y * 16 + 8 },
  { hold: ['right', 'cancel'], seconds: 9 },
];
const SHOTS = [
  { from: 0, black: true },

  // SUNNYSIDE: too perfect. Ves flings her crutch; the lane; the proud pose.
  { from: 0.05, scene: 'chapter_four_opens', pre: 4.6, pause: 0.9 },
  { from: 3, scene: 'the_ground_gives', pre: 4.9, pause: 0.9 },

  // THE FALL (the scene carries it), and then the Glimmering.
  { from: 10, scene: 'soft_landing', pre: 0 },
  { from: 12.5, room: 'glimmer_kings_road', party: VES, day: 0.3, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 14, room: 'glimmer_prism_hall', party: VES, day: 0.3, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 15, room: 'glimmer_crystal_bridge', party: VES, day: 0.3, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },

  // BELOWTOWN: the gate and its crowd, the market, the forge.
  { from: 16, scene: 'into_belowtown', pre: 0 },
  { from: 18, room: 'belowtown_market', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 19, room: 'belowtown_forge', party: VES, day: 0.4, keys: [{ hold: ['up', 'cancel'], seconds: 9 }] },

  // THE DIGGINGS: carts and tracks.
  { from: 20, room: 'diggings_cart_yard', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 21.5, room: 'diggings_trestle', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 22.5, room: 'diggings_pithead', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },

  // THE STILLWATER, then the dark.
  { from: 24, room: 'stillwater_shore', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 25, room: 'stillwater_isles', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 26, room: 'deep_first_dark', party: VES, day: 0.4, keys: [{ hold: ['down', 'cancel'], seconds: 9 }] },
  { from: 27.5, room: 'deep_crawl', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },

  // The build: black for the words.
  { from: 29.5, black: true },

  // THE DROP.
  { from: 32, battle: 'gleamsnail', party: VES, weapon: 'quartz_edge', spell: 'sunburst', pre: 0.1, pause: 0.8 },
  { from: 33, battle: 'drillbug', party: VES, weapon: 'miners_pick', fight: true },
  { from: 34, battle: 'rumbold', party: VES, weapon: 'quartz_edge', line: 'KING PEPTUP flings out an arm to the house, beaming, as the spotlight finds him.' },
  { from: 35, battle: 'slagling', party: VES, weapon: 'miners_pick' },
  { from: 36, battle: 'quartzling', party: VES, weapon: 'quartz_edge', spell: 'tempest', pre: 0.1, pause: 0.8 },
  { from: 37, battle: 'blindfish', party: VES, weapon: 'ferry_pole' },
  { from: 38, battle: 'rumbold', party: VES, weapon: 'deepglass_blade', fight: true, line: "KING PEPTUP's crown catches the footlights. The whole house is hanging on his next word." },
  { from: 39, battle: 'murk', party: VES, weapon: 'deepglass_blade' },

  // The finale: places, bright.
  { from: 40, room: 'glimmer_crystal_bridge', party: VES, day: 0.3, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 41, room: 'belowtown_square', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 42, room: 'stillwater_isles', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },
  { from: 43, room: 'diggings_switchback', party: VES, day: 0.4, keys: [{ hold: ['right', 'cancel'], seconds: 9 }] },

  // NOBODY'S HERO.
  { from: 44, title: true },
  { from: 48, black: true },
];
const END = 50.5;
const HITS = [32, 40, 44];

runTrailer({
  bpm: 120,
  song: SONGS.trailerFirst,
  end: END,
  text: TEXT,
  shots: SHOTS,
  hits: HITS,
  flashes: [32, 40],
  title: { at: 44, name: "NOBODY'S HERO", sub: 'CHAPTER 4: THE FIRST', subAt: 45.5, to: 48 },
  filename: 'nobodys-hero-chapter-4.webm',
  day: 0.2,
  battleLines: true,
  setup() {
    // The party at a chapter 4 level (the HUD and HP follow the real curve).
    HERO_STATE.level = 32;
    delete HERO_STATE.hp;
    WORLD_STATE.chapter = 4;
    WORLD_STATE.seenScenes = [];
  },
});
</script>
</body>
</html>
