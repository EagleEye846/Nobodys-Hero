<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The game loads its text relative to the page, so act as if we're in the game's folder. -->
<base href="../">
<title>Room Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@700&display=swap">
<style>
  body { background: #000; color: #e8e4f4; font: 14px system-ui, sans-serif; margin: 0; }
  canvas { display: block; image-rendering: pixelated; }
  #report { padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<div id="report"></div>
<script>
  // Any error (including one loading the modules) goes into the report, for headless runs.
  const show = (m) => { document.getElementById('report').textContent += `
ERROR: ${m}`; };
  window.addEventListener('error', (e) => show(`${e.message} (${e.filename}:${e.lineno})`));
  window.addEventListener('unhandledrejection', (e) => show(e.reason?.stack ?? e.reason));
</script>
<!-- onerror: a module that failed to load (the server dropped a file) says so at once, so a headless run can try again. -->
<script type="module" onerror="show('a module failed to load')">
// A still of any room, as the game draws it, for checking rooms without
// playing to them: tools/preview.html?room=rest_square&x=20&y=16&facing=up&t=2
// Or ?check=1 to build every room and compile every song, and report.
// ?equip=hero or ?equip=vesper shows the EQUIP menu on that person's tabs
// (&slot=armor for armor, &index=2 for the cursor), with Ves in the party
// and all her gear owned. ?allyturn=vesper shows a battle on her turn
// (&phase=spells for her SPELLS list; &hurt=vesper with either, for her hurt). ?bossphase=usurper&stage=1 (0, 1, 2;
// &hurt=vesper and &area=valley for the_hush)
// puts a boss with `phases` in that phase, plays every one of its attacks
// for that phase through, then its turn's end, and draws the box mid-attack
// (&pattern=<name> to draw that one, &t=3 seconds in).
import { UI_WIDTH, UI_HEIGHT, UI_SCALE } from './src/config.js';
import { createScreen } from './src/engine/screen.js';
import { loadTextFiles } from './src/engine/textLoader.js';
import { loadUiFont } from './src/ui/text.js';
import { TEXT_FILES } from './src/data/textManifest.js';
import { OverworldScene } from './src/overworld/overworldScene.js';
import { Room } from './src/overworld/room.js';
import { ROOMS } from './src/data/rooms/index.js';
import { SONGS } from './src/data/music/index.js';
import { renderSong, compile } from './src/audio/music.js';
import { SAMPLE_SETS } from './src/audio/sampleSets.js';

const params = new URLSearchParams(location.search);
const report = document.getElementById('report');
const ctx = createScreen(document.getElementById('game'), UI_WIDTH, UI_HEIGHT);
await Promise.all([loadUiFont(), loadTextFiles(TEXT_FILES)]);

// &chapter=5 puts the world in that chapter (Sunnyside's first four rooms read differently in 5: chapterRooms.js).
if (params.get('chapter')) (await import('./src/state/saveGame.js')).WORLD_STATE.chapter = Number(params.get('chapter'));

const noInput = { isDown: () => false, wasPressed: () => false, endFrame() {} };

if (params.get('check')) {
  // Reported line by line, so a headless run shows how far it got.
  const lines = { push(line) { report.textContent += `${line}\n`; } };
  report.textContent = 'CHECK START\n';
  for (const [id, data] of Object.entries(ROOMS)) {
    try {
      const room = new Room(data);
      // Every door leads somewhere real, onto walkable ground.
      for (const door of data.doors ?? []) {
        const to = ROOMS[door.to];
        if (!to) throw new Error(`door to unknown room ${door.to}`);
        const target = new Room(to);
        if (target.isSolidTile(door.spawn.x, door.spawn.y)) throw new Error(`door to ${door.to} spawns in a wall at ${door.spawn.x},${door.spawn.y}`);
      }
      // Mine-cart track: no loose ends, carts and barricades on rails, doors that line up.
      if (data.rails || data.props.some((p) => p.cart || p.smash)) {
        const { railProblems } = await import('./src/overworld/carts.js');
        const problems = railProblems(data, ROOMS);
        if (problems.length) throw new Error(problems.join('; '));
      }
      // A room with a Chapter 5 look builds that way too, and its doors lead somewhere real.
      if (data.chapter5) {
        const { applyVariant } = await import('./src/overworld/chapterRooms.js');
        const later = applyVariant(data, data.chapter5);
        new Room(later);
        for (const door of later.doors ?? []) {
          const to = ROOMS[door.to];
          if (!to) throw new Error(`chapter 5: door to unknown room ${door.to}`);
          if (new Room(to).isSolidTile(door.spawn.x, door.spawn.y)) throw new Error(`chapter 5: door to ${door.to} spawns in a wall at ${door.spawn.x},${door.spawn.y}`);
        }
      }
      lines.push(`room ok: ${id} (${room.width}x${room.height}, ${room.props.length} props)`);
    } catch (e) {
      lines.push(`ROOM FAIL: ${id}: ${e.message}`);
    }
  }
  for (const [name, song] of Object.entries(params.get('songs') ? SONGS : {})) {
    try {
      // Compiling catches mistakes (tracks of different lengths, missing
      // instruments); rendering a little of the one named by ?song= gives its level.
      const { steps } = compile(song);
      if (params.get('song') !== name) {
        lines.push(`song ok: ${name} "${song.title}" ${steps.length} steps, ${Math.round(steps.length * 60 / song.bpm / song.stepsPerBeat)}s`);
        continue;
      }
      // A sampled instrument retunes its nearest recording, and a note far
      // from every recording sounds strained: say where one is played.
      for (const [track, instrument] of Object.entries(song.instruments)) {
        if (!instrument.sample || instrument.drum) continue;
        const notes = SAMPLE_SETS[instrument.sample].notes;
        const played = Object.values(song.sections).flatMap((section) => section[track] ?? []).filter((step) => typeof step === 'number');
        if (!played.length) continue;
        const shift = 12 * (instrument.octave ?? 0);
        const far = Math.max(...played.map((note) => Math.min(...notes.map((n) => Math.abs(n - (note + shift))))));
        if (far > 2) lines.push(`  range: ${track} (${instrument.sample} ${Math.min(...notes)}-${Math.max(...notes)}) plays ${Math.min(...played) + shift}-${Math.max(...played) + shift}, up to ${far} semitones from a recording`);
      }
      // Loudness over time: the RMS of each window, so a song that goes quiet
      // (or silent, which would be a bug) shows where.
      const seconds = Number(params.get('seconds') ?? 6);
      const rate = 8000;
      const buffer = await renderSong(song, seconds, rate);
      const data = buffer.getChannelData(0);
      const windowSeconds = Number(params.get('window') ?? 8);
      const size = Math.round(windowSeconds * rate);
      const levels = [];
      for (let start = 0; start < data.length; start += size) {
        let sum = 0;
        const end = Math.min(data.length, start + size);
        for (let i = start; i < end; i++) sum += data[i] * data[i];
        levels.push(Math.sqrt(sum / (end - start)));
      }
      // And the loudest single sample: over 1 clips.
      let peak = 0;
      for (const channel of [0, 1]) for (const v of buffer.getChannelData(channel)) peak = Math.max(peak, Math.abs(v));
      lines.push(`song ok: ${name} "${song.title}" peak ${peak.toFixed(2)}, rms by ${windowSeconds}s: ${levels.map((l) => l.toFixed(3)).join(' ')}`);
    } catch (e) {
      lines.push(`SONG FAIL: ${name}: ${e.message}`);
    }
  }
  lines.push('CHECK DONE');
} else if (params.get('skills')) {
  // The skill tree as it looks in chapter `skills`, with a few skills learned.
  const { SkillsMenu } = await import('./src/ui/skillsMenu.js');
  const { WORLD_STATE } = await import('./src/state/saveGame.js');
  const { HERO_STATE } = await import('./src/characters/heroState.js');
  WORLD_STATE.chapter = Number(params.get('skills'));
  HERO_STATE.skillPoints = 3;
  HERO_STATE.skills = ['sharpened', 'keen_eye', 'focus', 'tough', 'sprinter'];
  // &party=1 (Ves) or &party=bramble,vesper; &page=1 shows the first member's page.
  if (params.get('party')) {
    HERO_STATE.party = params.get('party') === '1' ? ['vesper'] : params.get('party').split(',');
    HERO_STATE.memberPoints = Object.fromEntries(HERO_STATE.party.map((id) => [id, 4]));
  }
  const menu = new SkillsMenu();
  menu.open();
  if (params.get('page')) {
    menu.page = Number(params.get('page'));
    menu.branches = menu.pages[menu.page].branches;
  }
  menu.branch = Number(params.get('branch') ?? 1);
  menu.index = Number(params.get('index') ?? 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  menu.draw(ctx);
  menu.draw(ctx);
  report.textContent = 'SKILLS DONE';
} else if (params.get('bubbles')) {
  // ?bubbles=1: every enemy's speech-bubble lines, split into bubbles the way
  // a battle splits them (speechBubbles in src/battle/hud.js), one per line.
  const { speechBubbles } = await import('./src/battle/hud.js');
  const { textFile } = await import('./src/engine/textLoader.js');
  const out = [];
  for (const file of TEXT_FILES.filter((f) => f.startsWith('enemies/'))) {
    for (const [section, entries] of Object.entries(textFile(file))) {
      if (!/^(taunts|boss_intro|mercy_mock|smoke_)/.test(section) && !section.endsWith(' foe')) continue;
      for (const entry of entries) out.push(`${file} [${section}] ${speechBubbles(entry).map((b) => `(${b})`).join(' ')}`);
    }
  }
  report.textContent = `${out.join('\n')}\nBUBBLES DONE`;
} else if (params.get('pausemenu')) {
  // ?pausemenu=bar draws the C menu's bar; ?pausemenu=settings its SETTINGS screen.
  const { PauseMenu } = await import('./src/ui/pauseMenu.js');
  const menu = new PauseMenu();
  menu.open();
  if (params.get('pausemenu') === 'settings') {
    menu.tab = 5;
    menu.screens[5].open();
  }
  // ?pausemenu=journal: the JOURNAL screen with a few pages filled in;
  // &cursor=N picks a page, &press=down,down presses keys.
  if (params.get('pausemenu') === 'journal') {
    const { HERO_STATE } = await import('./src/characters/heroState.js');
    if (params.get('chapter')) (await import('./src/state/saveGame.js')).WORLD_STATE.chapter = Number(params.get('chapter'));
    HERO_STATE.journal = { bunny: { beaten: 3, spared: 1, loot: true }, dummy: { beaten: 1, spared: 0, loot: false }, waxling: { beaten: 0, spared: 2, loot: false }, taper: { beaten: 1, spared: 0, loot: true }, step: { beaten: 2, spared: 0, loot: false }, rimewing: { beaten: 0, spared: 1, loot: false }, the_hush: { beaten: 1, spared: 0, loot: true } };
    menu.tab = 4;
    menu.screens[4].open();
    menu.screens[4].cursor = Number(params.get('cursor') ?? 0);
    for (const key of (params.get('press') ?? '').split(',').filter(Boolean)) {
      menu.screens[4].update({ isDown: () => false, wasPressed: (a) => a === key, endFrame() {} });
    }
  }
  // ?pausemenu=skills: the SKILLS screen in chapter 5 with Ves and Bramble, a few
  // stars learned; &press=right,down,down presses keys on it in order.
  if (params.get('pausemenu') === 'skills') {
    const { HERO_STATE } = await import('./src/characters/heroState.js');
    const { WORLD_STATE } = await import('./src/state/saveGame.js');
    const { joinParty } = await import('./src/characters/party.js');
    WORLD_STATE.chapter = 5;
    WORLD_STATE.seenScenes = ['ways_of_the_sea'];
    joinParty('vesper');
    joinParty('bramble');
    HERO_STATE.skills = ['sharpened', 'keen_eye', 'ves_crosswind', 'ves_squall', 'ves_downdraft'];
    menu.tab = 2;
    menu.screens[2].open();
    for (const key of (params.get('press') ?? '').split(',').filter(Boolean)) {
      menu.screens[2].update({ isDown: () => false, wasPressed: (a) => a === key, endFrame() {} });
    }
  }
  // ?pausemenu=items: the ITEMS screen, hurt, with a bag of food and a
  // candle; &press=confirm,confirm presses keys on it in order. &party=1
  // brings Ves and Bramble along, hurt too, to pick who eats.
  if (params.get('pausemenu') === 'items') {
    const { HERO_STATE } = await import('./src/characters/heroState.js');
    const { setHeroHp } = await import('./src/characters/progress.js');
    HERO_STATE.items = ['trail_mix', 'lantern_tea', 'glow_candle', 'ember_toffee'];
    setHeroHp(Number(params.get('hp') ?? 20));
    if (params.get('party')) {
      const { joinParty, setMemberHp } = await import('./src/characters/party.js');
      joinParty('vesper');
      joinParty('bramble');
      setMemberHp('vesper', 30);
      setMemberHp('bramble', 10);
    }
    menu.tab = 0;
    menu.screens[0].open();
    for (const key of (params.get('press') ?? '').split(',').filter(Boolean)) {
      menu.screens[0].update({ isDown: () => false, wasPressed: (a) => a === key, endFrame() {} });
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  menu.draw(ctx);
  report.textContent = 'PAUSEMENU DONE';
} else if (params.get('storage')) {
  // ?storage=1: a storage chest's screen, with a bag and a store full of
  // stacks; &press=right,confirm,... pressed in order.
  const { StorageMenu } = await import('./src/ui/storageMenu.js');
  const { HERO_STATE } = await import('./src/characters/heroState.js');
  const { WORLD_STATE } = await import('./src/state/saveGame.js');
  WORLD_STATE.chapter = Number(params.get('chapter') ?? 3);
  HERO_STATE.items = ['trail_mix', 'trail_mix', 'lantern_tea', 'glow_candle', 'ember_toffee', 'trail_mix'];
  HERO_STATE.storage = ['eel_pie', 'eel_pie', 'eel_pie', 'mags_jam', 'spring_water', 'hollin_apple', 'eel_pie', 'boiled_boot', 'music_box', 'hob_scone', 'hob_scone', 'kiln_stew'];
  const menu = new StorageMenu();
  menu.open();
  const out = [];
  for (const key of (params.get('press') ?? '').split(',').filter(Boolean)) {
    menu.update({ isDown: () => false, wasPressed: (a) => a === key, endFrame() {} });
    out.push(`${key}: bag ${HERO_STATE.items.length} storage ${HERO_STATE.storage.length} note ${menu.noteLeft > 0 ? menu.note : '-'}`);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  menu.draw(ctx);
  report.textContent = `${out.join('\n')}\nSTORAGE DONE`;
} else if (params.get('shop')) {
  // ?shop=<id>: a shop's screen, with &press=confirm,down,... pressed in order
  // (each press gets a moment for the text to type out).
  const { ShopScene } = await import('./src/shop/shopScene.js');
  const { HERO_STATE } = await import('./src/characters/heroState.js');
  HERO_STATE.gold = 2000;
  const shop = new ShopScene(params.get('shop'), () => {});
  const idle = { isDown: () => false, wasPressed: () => false, endFrame() {} };
  for (let i = 0; i < 120; i++) shop.update(1 / 60, idle);
  for (const key of (params.get('press') ?? '').split(',').filter(Boolean)) {
    shop.update(1 / 60, { isDown: () => false, wasPressed: (a) => a === key, endFrame() {} });
    for (let i = 0; i < 120; i++) shop.update(1 / 60, idle);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  shop.draw(ctx);
  report.textContent = 'SHOP DONE';
} else if (params.get('fishing')) {
  // ?fishing=<moment>: Gubb's fishing screen (src/ui/fishingScene.js) at a
  // moment: offer, ready, wait, bite, fight, landed (&fish=<id> picks the catch,
  // &t=2 seconds in, &hold=1 holds Z in the fight).
  const { FishingScene, FISH } = await import('./src/ui/fishingScene.js');
  const mode = params.get('fishing');
  if (params.get('ves') !== '0') (await import('./src/characters/party.js')).joinParty('vesper');
  if (mode === 'play') {
    // The whole thing played by pressing keys: offer, borrow, cast, wait, bite,
    // tug of war (holding Z only while the marker is under the fish), catch,
    // read Gubb through, cast again, then X to leave. Prints each step.
    const { WORLD_STATE } = await import('./src/state/saveGame.js');
    const { joinParty } = await import('./src/characters/party.js');
    joinParty('vesper');
    let left = false;
    const scene = new FishingScene(() => { left = true; });
    const out = [];
    const note = (what) => out.push(`${scene.mode}${scene.talking ? '+text' : ''}: ${what}`);
    const keyOf = (name, hold = false) => ({ isDown: (a) => hold && a === name, wasPressed: (a) => !hold && a === name, endFrame() {} });
    const none = { isDown: () => false, wasPressed: () => false, endFrame() {} };
    const step = (input = none) => scene.update(1 / 60, input);
    const readText = () => { for (let i = 0; i < 4000 && scene.talking; i++) step(i % 3 === 0 ? keyOf('confirm') : none); };
    let catches = 0;
    readText(); note('offer read');
    step(keyOf('confirm')); note('chose BORROW');
    readText(); note('how-to read');
    for (let round = 0; round < 3 && !left; round++) {
      step(keyOf('confirm')); note('cast');
      for (let i = 0; i < 60 * 12 && scene.mode !== 'bite'; i++) step();
      note(`bite (fish ${scene.fish?.id})`);
      step(keyOf('confirm')); note('struck');
      for (let i = 0; i < 60 * 60 && scene.mode === 'fight'; i++) {
        const f = scene.fight;
        step(keyOf('confirm', !params.get('lose') && f.marker + 18 > f.zoneY + scene.fish.zone / 2));
      }
      note(`fight over, progress ${scene.fight?.progress.toFixed(2)}`);
      for (let i = 0; i < 60 * 4 && scene.mode === 'landed'; i++) step();
      readText();
      note(`text read; caught so far ${WORLD_STATE.fishing.caught}`);
    }
    step(keyOf('cancel')); note('X (put the rod back)');
    readText();
    step(); step();
    out.push(`left the screen: ${left}`);
    report.textContent = out.join(String.fromCharCode(10)) + ' FISHING DONE';
  } else if (mode === 'all') {
    // Every fish picture in a row, for checking the art.
    const { drawFish } = await import('./src/ui/fishingScene.js');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0a1228';
    ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
    FISH.forEach((fish, i) => drawFish(ctx, fish.id, 80 + (i % 4) * 150, 100 + Math.floor(i / 4) * 150, 1.5));
    report.textContent = 'FISHING DONE';
  } else {
    const scene = new FishingScene(() => {});
    const idle = { isDown: () => false, wasPressed: () => false, endFrame() {} };
    const hold = params.get('hold') === '1' ? { isDown: () => true, wasPressed: () => false, endFrame() {} } : idle;
    if (mode !== 'offer') scene.debugJump(mode === 'choose' ? 'choose' : mode, params.get('fish') ?? 'moonblind_minnow');
    if (mode === 'choose') scene.talking = false;
    const frames = Math.round(Number(params.get('t') ?? 1) * 60);
    for (let i = 0; i < 40; i++) scene.update(1 / 60, idle);
    for (let i = 0; i < frames; i++) scene.update(1 / 60, mode === 'fight' ? hold : idle);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
    scene.draw(ctx);
    report.textContent = `FISHING DONE mode=${scene.mode}`;
  }
} else if (params.get('equip')) {
  const { EquipMenu } = await import('./src/ui/equipMenu.js');
  const { HERO_STATE } = await import('./src/characters/heroState.js');
  const { joinParty } = await import('./src/characters/party.js');
  const { WEAPONS } = await import('./src/data/weapons.js');
  const { ARMOR } = await import('./src/data/armor.js');
  HERO_STATE.gold = 240;
  if (params.get('party') !== '0') joinParty('vesper');
  if (params.get('equip') === 'bramble') joinParty('bramble');
  const { setHurt } = await import('./src/characters/party.js');
  for (const id of (params.get('hurt') ?? '').split(',').filter(Boolean)) setHurt(id, true);
  HERO_STATE.weapons = Object.keys(WEAPONS);
  HERO_STATE.armors = Object.keys(ARMOR);
  const menu = new EquipMenu();
  menu.open();
  const who = ['vesper', 'bramble'].includes(params.get('equip')) ? params.get('equip') : 'hero';
  const tab = menu.tabs().findIndex((t) => t.who === who && t.slot === (params.get('slot') ?? 'weapon'));
  menu.showTab(Math.max(0, tab));
  if (params.has('index')) menu.cursor = Number(params.get('index'));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  menu.draw(ctx);
  report.textContent = 'EQUIP DONE';
} else if (params.get('allyturn')) {
  const { BattleScene } = await import('./src/battle/battleScene.js');
  const { ENEMIES } = await import('./src/data/enemies/index.js');
  const { joinParty } = await import('./src/characters/party.js');
  const { WORLD_STATE } = await import('./src/state/saveGame.js');
  WORLD_STATE.metShadow = true;
  joinParty(params.get('allyturn'));
  // &hurt=vesper: she's hurt (half HP, her hurt SPELLS, sitting down).
  const { setHurt } = await import('./src/characters/party.js');
  for (const id of (params.get('hurt') ?? '').split(',').filter(Boolean)) setHurt(id, true);
  const battle = new BattleScene([ENEMIES[params.get('enemy') ?? 'craghorn']], () => {}, params.get('area') ?? 'vigil');
  battle.sp = 30;
  battle.setPhase('command');
  battle.ally = battle.pendingAllies.shift();
  battle.setPhase('ally');
  battle.allySelected = Number(params.get('button') ?? 0);
  if (params.get('phase')) battle.setPhase(params.get('phase'));
  // &act=HOLLER,HIDE... casts each of the member's spells in turn (with the
  // enemy's turn after each), to check they all go through.
  for (const label of (params.get('act') ?? '').split(',').filter(Boolean)) {
    const { MEMBERS } = await import('./src/characters/party.js');
    const member = MEMBERS[params.get('allyturn')];
    const command = [...member.commands, ...Object.values(member.learnable ?? {}), ...(member.hurt?.commands ?? [])].find((c) => c.label === label);
    battle.target = battle.foes[0];
    battle.actor = battle.ally;
    battle.allyAct(battle.ally, command);
    // (What the panel said as the enemy's turn began, and how slowed it was.)
    let opening = null;
    for (let t = 0; t < 12; t += 1 / 60) {
      battle.update(1 / 60, t % 0.2 < 0.02 ? { isDown: () => false, wasPressed: (a) => a === 'confirm', endFrame() {} } : noInput);
      if (!opening && battle.phase === 'dodge') opening = `slowed ${battle.callOutLeft.toFixed(1)}s, panel "${battle.dodgeHint ?? ''}"`;
    }
    report.textContent += `cast ${label}: phase ${battle.phase}, foe HP ${battle.foes[0].hp}, hiding ${battle.hiding ?? '-'}, sneaking ${battle.sneaking ?? '-'}, ${battle.ally.name} HP ${battle.ally.hp}/${battle.ally.maxHp}, first enemy turn: ${opening ?? '-'}
`;
    battle.setPhase('command');
    battle.ally = battle.pendingAllies.shift() ?? battle.party.find((m) => m.ally);
    battle.setPhase('ally');
  }
  for (let t = 0; t < 1; t += 1 / 60) battle.update(1 / 60, noInput);

      // park:room,cart,x,y: leave that cart parked on that tile in the room's memory (as if rolled
      // there earlier); enter:room,x,y then walks in at that spawn tile, as through a door.
      else if (op === 'park') {
        const [pr, pc, px, py] = a.split(',');
        WORLD_STATE.carts ??= {};
        WORLD_STATE.carts[pr] ??= { carts: {}, smashed: [], made: [] };
        WORLD_STATE.carts[pr].carts[pc] = [Number(px), Number(py)];
      }
      else if (op === 'enter') {
        const [er, ex, ey] = a.split(',');
        scene = new OverworldScene(ROOMS[er], { x: Number(ex), y: Number(ey) }, ROOMS[er].area);
        scene.enter?.(playGame);
        if (!params.get('enemies')) scene.npcs = [];
      }
      // saveload: save here as a crystal would, load that save back (as Continue does,
      // everything through the browser's storage), and come back into the room from it.
      else if (op === 'saveload') {
        const { saveGame, loadGame } = await import('./src/state/saveGame.js');
        const [sx, sy] = tile(scene.player).split(',').map(Number);
        saveGame(scene.roomData.id, { x: sx, y: sy });
        if (!loadGame()) throw new Error('saveload: no save came back');
        const at = WORLD_STATE.room;
        scene = new OverworldScene(ROOMS[at], WORLD_STATE.spawn, ROOMS[at].area);
        scene.enter?.(playGame);
        if (!params.get('enemies')) scene.npcs = [];
      }
      // savedump: what Continue would load right now (room, spot, chapter, and
      // whether the scenes named after it, comma-separated, are seen).
      else if (op === 'savedump') {
        const { loadGame } = await import('./src/state/saveGame.js');
        if (!loadGame()) throw new Error('savedump: no save');
        const seen = WORLD_STATE.seenScenes ?? [];
        report.textContent += `save: ${WORLD_STATE.room} @${JSON.stringify(WORLD_STATE.spawn)} chapter ${WORLD_STATE.chapter} done ${WORLD_STATE.chapterDone ?? '-'} | ${(a ?? '').split(',').filter(Boolean).map((id) => `${id}=${seen.includes(id) ? 'seen' : 'NOT SEEN'}`).join(' ')}
`;
      }
      // cartin:room,x,y,D: arrive in that room by mine cart, as if through a door, heading D
      // (U, D, L or R) from the tile x,y.
      else if (op === 'cartin') {
        const [room, cx, cy, way] = b ? [a, ...b.split(',')] : a.split(',');
        scene = new OverworldScene(ROOMS[room], { x: Number(cx), y: Number(cy) }, ROOMS[room].area, { cart: { dir: way } });
        scene.enter?.(playGame);
        if (!params.get('enemies')) scene.npcs = [];
      }
      // settle:n: carry on (up to n frames, 3000 if left out) until every cart has stopped
      // and any ride, door or fade is over. Fails if they're still going.
      else if (op === 'settle') {
        for (let i = 0; i < Number(a ?? 3000) && scene.carts.busy; i++) scene.update(1 / 60, noInput);
        if (scene.carts.busy) throw new Error(`carts still moving; ${state()}`);
      }
      // trace:dir:n: walk n frames, printing each follower every frame.
      else if (op === 'trace') {
        for (let i = 0; i < Number(b); i++) {
          scene.update(1 / 60, { isDown: (k) => k === keys[a], wasPressed: () => false, endFrame() {} });
          report.textContent += `t${i} you ${scene.player.x.toFixed(1)},${scene.player.y.toFixed(1)} ${scene.player.facing} | ${scene.followers.map((f) => `${f.id} ${f.x.toFixed(1)},${f.y.toFixed(1)} ${f.dir}${f.walking ? ' W' : ' S'}${f.running ? 'R' : ''}${f.glanceDir ? " g" + f.glanceDir : ""} sag${f.sag}`).join(' ')}
`;
        }
      }
      // walkcheck:dir:n: walk n frames, and count the frames each follower's walking or still.
      else if (op === 'walkcheck') {
        const counts = {};
        for (let i = 0; i < Number(b); i++) {
          scene.update(1 / 60, { isDown: (k) => k === keys[a], wasPressed: () => false, endFrame() {} });
          for (const f of scene.followers) {
            counts[f.id] ??= { walking: 0, still: 0, flips: 0, last: null };
            const c = counts[f.id];
            c[f.walking ? 'walking' : 'still']++;
            if (c.last !== null && c.last !== f.walking) c.flips++;
            c.last = f.walking;
          }
        }
        report.textContent += `walkcheck: ${Object.entries(counts).map(([id, c]) => `${id} walking ${c.walking} still ${c.still} flips ${c.flips}`).join('; ')}
`;
      }
      // probe: what Z would land on from here.
      else if (op === 'probe') {
        const pts = scene.player.interactionPoints();
        report.textContent += `probe: points ${pts.map(([x, y]) => `${Math.floor(x / 16)},${Math.floor(y / 16)}`).join(' ')} -> ${pts.map(([x, y]) => scene.room.propAt(x, y) ? `${scene.room.propAt(x, y).look}[gives=${scene.room.propAt(x, y).gives},draw=${scene.room.propAt(x, y).drawScene}]` : "-").join(" ")}
`;
      }
      else if (op === 'expect') {
        const gates = scene.room.props.filter((p) => p.opensWith);
        const ok = {
          gate: () => (gates[Number(b?.split(',')[0] ?? 0)]?.isOpen ? 'open' : 'shut') === (b?.split(',')[1] ?? 'open'),
          bridged: () => scene.room.bridged.has(b),
          log: () => scene.room.props.some((p) => p.log && `${p.x / 16},${p.y / 16}` === b),
          split: () => Boolean(scene.partner),
          together: () => !scene.partner,
          // steering:hero|vesper|bramble (who you're walking), waiting:n (n bodies standing apart), seen (the sweeping lamp has you).
          steering: () => (scene.player.skin ?? 'hero') === b,
          waiting: () => scene.others.length === Number(b),
          seen: () => Boolean(scene.caught?.lamp),
          unseen: () => !scene.caught,
          lever: () => scene.room.isLeverOn(b),
          // The mine carts: riding, rolling (any cart moving), room:id, cart:id,x,y
          // (a cart at rest on that tile), switch:name,on|off, barricade:x,y,smashed|whole.
          riding: () => Boolean(scene.carts.riding),
          rolling: () => scene.carts.carts.some((c) => c.state === 'roll' || c.state === 'board'),
          room: () => scene.roomData.id === b,
          cart: () => {
            const [id, cx, cy] = b.split(',');
            const c = scene.carts.cartById(id);
            return Boolean(c) && c.state === 'rest' && c.tx === Number(cx) && c.ty === Number(cy);
          },
          switch: () => {
            const [name, want] = b.split(',');
            return (scene.room.isLeverOn(name) ? 'on' : 'off') === want;
          },
          barricade: () => {
            const [bx, by, want] = b.split(',');
            const prop = scene.room.allProps.find((p) => p.smash && p.x === Number(bx) * 16 && p.y === Number(by) * 16);
            return Boolean(prop) && (prop.smashed ? 'smashed' : 'whole') === want;
          },
          at: () => tile(scene.player) === b,
          // uncaught: the Hush (or the Crawl's hunter) hasn't caught you yet this run.
          uncaught: () => !(WORLD_STATE.read ?? []).includes('hush_caught'),
          chapter: () => WORLD_STATE.chapter === Number(b),
          // (seen / unseen with no scene id are the sweeping lamp's, above: this key wins, so it asks.)
          unseen: () => (b ? !(WORLD_STATE.seenScenes ?? []).includes(b) : !scene.caught),
          seen: () => (b ? (WORLD_STATE.seenScenes ?? []).includes(b) : Boolean(scene.caught?.lamp)),
          sinking: () => Boolean(scene.caught?.bog),
          carrying: () => Boolean(scene.heroBody.carrying),
          look: () => scene.room.props.some((p) => p.look === b && !p.hidden),
          // chime:set,n: n notes of that singing-crystal set's tune have been rung right in a row.
          chime: () => { const [set, n] = b.split(','); return (scene.chimes.progress.get(set) ?? 0) === Number(n); },
          // gear:id (you have that gear).
          gear: () => (heroState.gear ?? []).includes(b),
          lit: () => scene.room.isLeverOn(b),
          // The tides: tide:high|low (settled), tile:x,y,c (that letter is there now; not ':'), wet:x,y, dry:x,y,
          // crate:x,y (a crate rests there), crate:x,y,sunk, crate:x,y,afloat.
          tide: () => Boolean(scene.room.tide) && !scene.room.tide.busy && scene.room.tide.state === b,
          tile: () => { const [tx, ty, ch] = b.split(','); return scene.room.tileAt(Number(tx), Number(ty)) === ch; },
          // wet:x,y (water or any solid tile there now, bridges ignored), dry:x,y (you could stand there).
          wet: () => scene.room.isSolidTile(...b.split(',').map(Number)),
          dry: () => !scene.room.isSolidTile(...b.split(',').map(Number)),
          crate: () => {
            const [tx, ty, how] = b.split(',');
            const c = scene.room.allProps.find((p) => p.float && !p.slide && p.x === Number(tx) * 16 && p.y === Number(ty) * 16);
            return Boolean(c) && (!how || (how === 'sunk' ? c.sunk : how === 'afloat' ? c.floating : false));
          },
          said: () => { const [part, n] = b.split(','); return (scene.said ?? []).filter((s) => s.includes(part)).length === Number(n); },
          beam: () => scene.beams.hasBeamAt(...b.split(',').map(Number)),
          nobeam: () => !scene.beams.hasBeamAt(...b.split(',').map(Number)),
          prism: () => { const [px, py, way] = b.split(','); return scene.room.props.some((p) => p.mirror === way && p.x === Number(px) * 16 && p.y === Number(py) * 16); },
          umbrella: () => Boolean(scene.beams.braced),
          noumbrella: () => !scene.beams.braced,
          hurt: () => isHurt(b),
          // taken:x,y: the purse or chest on that tile has been emptied.
          taken: () => (WORLD_STATE.taken ?? []).some((k) => k.startsWith(`${scene.roomData.id}:`) && k.endsWith(`:${b}`)),
          crutch: () => Boolean(scene.player.crutch),
          nocrutch: () => !scene.player.crutch,
          well: () => !isHurt(b),
          notcarrying: () => !scene.heroBody.carrying,
          // party:id (they're in the party) or party:!id (they aren't).
          party: () => (b.startsWith('!') ? !partyIds().includes(b.slice(1)) : partyIds().includes(b)),
          // flow:x,y,way: the current on that tile runs that way ('none' for no current).
          flow: () => {
            const [fx, fy, way] = b.split(',');
            return (scene.room.flowAt(Number(fx), Number(fy)) ?? 'none') === way;
          },
        }[a];
        if (!ok) throw new Error(`unknown expect '${a}'`);
        if (!ok()) throw new Error(`expected ${a}${b ? ` ${b}` : ''}; ${state()}`);
        lines.push(`ok: ${a} ${b ?? ''}`);
        continue;
      } else throw new Error(`unknown command '${cmd}'`);
      lines.push(`${cmd}  ->  ${state()}`);
    }
  } catch (e) {
    lines.push(`PLAY FAIL: ${e.message}`);
  }
  // &zoom=1: draw the last frame full size, for a screenshot.
  if (params.get('zoom')) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);

} else if (params.get('titlescreen') || params.get('credits')) {

  // draws the credits roll at that moment in the song.
  const { TitleScene } = await import('./src/title/titleScene.js');
  const { CreditsScene } = await import('./src/title/creditsScene.js');
  const at = Number(params.get('at') ?? 0);
  const fakeGame = { changeScene() {}, home: null };
  const press = { isDown: () => false, wasPressed: (a) => a === 'confirm', endFrame() {} };
  let scene;
  if (params.get('credits')) {
    scene = new CreditsScene(() => null, { text: params.get('credits'), song: params.get('song') ?? 'credits' });
  } else {
    scene = new TitleScene(() => null, () => null, () => null);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  ctx.setTransform(UI_SCALE, 0, 0, UI_SCALE, 0, 0);
  scene.draw(ctx);
  report.textContent += 'SCREEN DONE\n';
} else if (params.get('scene')) {
  // ?scene=<id>&at=<seconds>&with=vesper&hurt=vesper&x=&y=: plays that cutscene in real time
  // in its room (&room=<id> to override), pressing Z through any text after a
  // moment (&hold=2 to wait longer), and draws the screen `at` seconds in: for stills of
  // a scene's animation. &zoom=1 draws full size. &log=1 reports each text box and step.
  const { SCENES } = await import('./src/data/scenes/index.js');
  const { joinParty, setHurt } = await import('./src/characters/party.js');
  const { WORLD_STATE } = await import('./src/state/saveGame.js');
  const sceneData = SCENES[params.get('scene')];
  if (!sceneData) throw new Error(`No scene '${params.get('scene')}'`);
  for (const id of (params.get('with') ?? '').split(',').filter(Boolean)) joinParty(id);
  for (const id of (params.get('hurt') ?? '').split(',').filter(Boolean)) setHurt(id, true);
  if (params.get('seen')) WORLD_STATE.seenScenes = params.get('seen').split(',');

  let scene = new OverworldScene(roomData, at, roomData.area);
  const game = {
    home: null,
    changeScene(next) {
      // A goto or the end of the chapter: report where it went.
      report.textContent += `SCENE LEFT FOR ${next?.roomData?.id ?? next?.constructor?.name}\n`;
      if (next instanceof OverworldScene) { scene = next; scene.enter?.(game); }

  };

  scene.playCutscene(sceneData);
  const stopAt = Number(params.get('at') ?? 3);
  const hold = Number(params.get('hold') ?? 0.7);
  const press = (action) => ({ isDown: (a) => a === action, wasPressed: (a) => a === action, endFrame() {} });
  let last = performance.now();

  let open = 0;
  let steps = 0;
  let reached;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
        ctx.setTransform(UI_SCALE, 0, 0, UI_SCALE, 0, 0);

        return;
      }
      setTimeout(frame, 16);
    };

  });
  report.textContent += `${log.join('\n')}\nin ${scene.roomData.id}${scene.cutscene ? ` (scene still playing, at step ${scene.cutscene.index}: ${JSON.stringify(scene.cutscene.scene?.steps?.[scene.cutscene.index] ?? {}).slice(0, 80)})` : ' (scene over)'}\nSCENE DONE ${params.get('scene')}`;
} else if (params.get('push')) {
  // ?push=<room>&moves=x,y,R;x,y,D... plays a push puzzle through: for each

  // the rock slides a tile, and at the end reports whether the gates opened.
  const lines = { push(line) { report.textContent += `${line}\n`; } };

  const data = ROOMS[params.get('push')];

  scene.npcs = [];
  const keys = { U: 'up', D: 'down', L: 'left', R: 'right' };

    for (const move of (params.get('moves') ?? '').split(';').filter(Boolean)) {

      if (!rock) throw new Error(`no rock at ${x},${y}`);

      scene.player.ground = 0;
      scene.player.x = (Number(x) - dx) * 16 + 8;

  } catch (e) {
    lines.push(`PUSH FAIL: ${e.message}`);
  }
  scene.draw(ctx);
  lines.push('PUSH DONE');
} else if (params.get('poke')) {

  // &with=bramble pokes with a party member along (their comments, Bramble's chopping).
  if (params.get('with')) {
    const { joinParty } = await import('./src/characters/party.js');

  const confirmInput = { isDown: () => false, wasPressed: (a) => a === 'confirm', endFrame() {} };
  for (const id of ids) {

    // Only the words are being checked: monsters wandering into you would
    // start a fight and leave the text hanging.
    scene.npcs = [];
    for (const prop of room.allProps) {
      const label = `${id}: ${prop.look} at ${prop.x / 16},${prop.y / 16}`;
      // From below first; if another prop sits there (a cairn pair, a post under a
      // pillar) and the text keeps reopening, try again from each side.
      const tries = [[0, 1, 'up'], [1, 0, 'left'], [-1, 0, 'right']];
      try {

          scene.textbox.pages = null;
          scene.resting = null;
          scene.climb = null;
          scene.cutscene = null;
          // Standing below something that hangs over a door (the chapel's window)
          // puts you in the doorway: don't let that fade swallow every poke after it.
          scene.doorway = null;

          scene.player.y = prop.y + dy * 16 + 16;

          }
          // Any screen it opened (a shop) is fine; a rest is fine; make sure nothing is stuck.
          if (scene.textbox.isOpen) {
            if (t < tries.length - 1) continue;
            const page = scene.textbox.pages[scene.textbox.pageIndex];
            const busy = ['cutscene', 'hop', 'ride', 'battleFlash', 'doorway'].filter((key) => scene[key]);
            if (scene.player.isFalling) busy.push('falling');
            throw new Error(`text never closes (page ${scene.textbox.pageIndex + 1}/${scene.textbox.pages.length}: "${String(page?.text ?? page).slice(0, 40)}"${busy.length ? `; busy: ${busy.join(', ')}` : ''})`);
          }
          break;

        lines.push(`ok: ${label}`);

      }
    }
  }
  lines.push('POKE DONE');
} else {
  const id = params.get('room') ?? 'rest_square';
  const data = ROOMS[id];
  // ?day=0.75 sets the time of day (0 sunrise, 0.25 noon, 0.5 sunset, 0.75 midnight).
  if (params.has('day')) {
    const { WORLD_STATE } = await import('./src/state/saveGame.js');
    const { DAY_SECONDS } = await import('./src/overworld/daylight.js');

  }
  if (!data) throw new Error(`No room '${id}'`);
  // ?seen=a,b makes those scenes already seen (things that appear "after" them show up).
  if (params.get('seen')) {
    const { WORLD_STATE } = await import('./src/state/saveGame.js');
    WORLD_STATE.seenScenes = params.get('seen').split(',');
  }
  const spawn = params.has('x') ? { x: Number(params.get('x')), y: Number(params.get('y')) } : data.playerStart;
  // &levers=a,b: those switches start on (a beam's eye, say), so its light bridges are there.
  const levers = (params.get('levers') ?? '').split(',').filter(Boolean);
  // &with=vesper brings her along; &turn=8,3;11,4 turns the prisms there; &steer=1 steers her (Q)
  // with &sx=&sy= for where she stands; &facing= then turns whoever you're steering.
  for (const id of (params.get('with') ?? '').split(',').filter(Boolean)) (await import('./src/characters/party.js')).joinParty(id);
  const scene = new OverworldScene(data, spawn, data.area);
  const game = { changeScene() {}, home: null };
  scene.enter?.(game);
  // (Kept in the save, as an eye's switch is once it latches: beamSwitches alone is cleared on the first frame.)
  const { WORLD_STATE: save } = await import('./src/state/saveGame.js');
  for (const name of levers) (save.levers ??= []).push(scene.room.leverKey(name));
  for (const at of (params.get('turn') ?? '').split(';').filter(Boolean)) {
    const [tx, ty] = at.split(',').map(Number);
    scene.beams.interact(scene.room.props.find((p) => p.mirror && p.x === tx * 16 && p.y === ty * 16));
  }
  if (params.get('steer')) {
    const { WORLD_STATE } = await import('./src/state/saveGame.js');
    WORLD_STATE.read = ['swap_first_vesper_well', 'beam_umbrella_first'];
    scene.swap();
    if (params.has('sx')) { scene.player.x = Number(params.get('sx')) * 16 + 8; scene.player.y = (Number(params.get('sy')) + 1) * 16 - 3; }
  }
  if (params.get('facing')) scene.player.facing = { U: 'up', D: 'down', L: 'left', R: 'right' }[params.get('facing')] ?? params.get('facing');
  // Let the room settle (title card fades, animations run) for `t` seconds.
  const seconds = Number(params.get('t') ?? 2.5);
  for (let t = 0; t < seconds; t += 1 / 60) scene.update(1 / 60, noInput);
  // &idle=vesper:twirl,hero:stretch&idleat=0.3: the party fidgeting (idles.js), that far in.
  // (Left alone they start after standing about ten seconds or so: &t=40.)
  for (const pick of (params.get('idle') ?? '').split(',').filter(Boolean)) {
    const [who, name] = pick.split(':');
    const into = Number(params.get('idleat') ?? 0.3);
    if (who === 'hero') scene.player.fidget = { name, t: into };
    else {
      // (Stood in a row beside you, so none hides another.)
      const friend = scene.followers.find((f) => f.id === who);
      if (!friend) continue;
      friend.x = scene.player.x + 24 * (scene.followers.indexOf(friend) + 1);
      friend.y = scene.player.y;
      friend.startFidget(name, into);
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, UI_WIDTH, UI_HEIGHT);
  ctx.setTransform(UI_SCALE, 0, 0, UI_SCALE, 0, 0);
  scene.draw(ctx);
  report.textContent = `PREVIEW DONE ${id}`;
}
</script>
</body>
</html>
