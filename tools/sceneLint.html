<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<title>Scene Lint</title>
<style>
  body { background: #000; color: #e8e4f4; font: 13px monospace; margin: 0; }
  #report { padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="report"></div>
<script>
  const show = (m) => { document.getElementById('report').textContent += `\nERROR: ${m}`; };
  window.addEventListener('error', (e) => show(`${e.message} (${e.filename}:${e.lineno})`));
  window.addEventListener('unhandledrejection', (e) => show(e.reason?.stack ?? e.reason));
</script>
<!-- onerror: a module that failed to load (the server dropped a file) says so at once, so a headless run can try again. -->
<script type="module" onerror="show('a module failed to load')">
// Reads every scene (or the ones named in ?scenes=a,b; &ends=1 also tries each
// scene from both ends of its trigger) without playing it and
// reports things that look wrong: walks through walls, props and people,
// speakers off screen, actors starting on top of room props, and which
// triggers can be walked around. Straight-line walks are checked the way the
// scene player moves them (scenePlayer.js walk). Run it with
//   python tools/headless.py "http://localhost:8000/tools/sceneLint.html" 120
import { loadTextFiles } from './src/engine/textLoader.js';
import { TEXT_FILES } from './src/data/textManifest.js';
import { Room } from './src/overworld/room.js';
import { ROOMS } from './src/data/rooms/index.js';
import { SCENES } from './src/data/scenes/index.js';
import { WORLD_STATE } from './src/state/saveGame.js';
import { ANIMATION_NAMES } from './src/engine/animations.js';
import { ACTS } from './src/overworld/acts.js';
import { SOUND_NAMES } from './src/audio/music.js';
import { SONGS } from './src/data/music/index.js';
import { PORTRAITS } from './src/data/art/portraits.js';
import { PROP_SPRITES } from './src/data/art/props.js';

const report = document.getElementById('report');
const out = (line) => { report.textContent += `${line}\n`; };
await loadTextFiles(TEXT_FILES);

const params = new URLSearchParams(location.search);
const CH4 = (params.get('scenes') ?? 'chapter_four_opens,the_ground_gives,soft_landing,tuck_finds_you,tuck_at_the_bridge,tuck_on_the_road,tuck_shows_the_way,tuck_shows_the_way_on,into_belowtown,the_kings_welcome,tucks_whisper,homecoming,diggings_quake,diggings_lift_down,gubb_crossing,gubb_ferry_over,gubb_ferry_back,the_cold_camp,dark_turns_you_round,the_heros_camp,keeper_in_the_deep,glowworm_umbrella,something_listening,the_light_goes_up,rumbolds_duel,rumbold_spared,rumbold_defeated,the_hall_falls,bramble_and_the_log,the_long_rope,out_into_the_light,tuck_afterwards').split(',');
const T = 16;
const VIEW_W = 320;
const VIEW_H = 240;
const CAMERA_OFFSET_Y = -10;
const clamp = (p, world, view) => (world <= view ? Math.floor((world - view) / 2) : Math.round(Math.min(Math.max(p, 0), world - view)));

function setSeen(list) { WORLD_STATE.seenScenes = [...list]; }

function triggerFor(roomData, sceneId) {
  return (roomData.cutscenes ?? []).find((c) => c.scene === sceneId) ?? null;
}

function lintScene(scene, mode, startAt = null) {
  const problems = [];
  const roomData = ROOMS[scene.room];
  if (!roomData) { problems.push(`no room ${scene.room}`); return problems; }
  // The state when it plays: everything before it seen (mode 'late') or nothing.
  setSeen(mode === 'late' ? CH4.filter((id) => id !== scene.id && SCENES[id]) : []);
  const room = new Room(roomData);
  const trig = triggerFor(roomData, scene.id);
  const start = startAt ?? (trig ? { x: trig.x + Math.floor((trig.w - 1) / 2), y: trig.y + Math.floor((trig.h - 1) / 2) } : null);
  const pos = new Map();
  const hidden = new Map();
  let player = start ? { ...start } : null;
  for (const a of scene.actors ?? []) {
    pos.set(a.id, { x: a.x, y: a.y });
    hidden.set(a.id, Boolean(a.hidden));
  }
  const hiddenProps = new Set();
  for (const a of scene.actors ?? []) {
    if (!a.plays) continue;
    const prop = room.props.find((p) => p.character === a.plays && !p.hidden);
    if (prop) {
      hiddenProps.add(prop);
      pos.set(a.id, { x: a.centered ? prop.x / T + prop.width / T / 2 - 0.5 : prop.x / T, y: prop.y / T });
    } else if (player) pos.set(a.id, { ...player }); // a follower
  }
  const propsNow = () => room.props.filter((p) => !hiddenProps.has(p) && !p.hidden);
  const tileOf = (x, y) => [Math.floor(x + 0.5), Math.floor(y + 1 - 1 / T)];
  const blockedBy = (x, y) => {
    const [tx, ty] = tileOf(x, y);
    if (room.isSolidTile(tx, ty)) return `wall ${tx},${ty} (${room.tileAt(tx, ty)})`;
    const px = (x + 0.5) * T;
    const py = (y + 1) * T - 1;
    for (const p of propsNow()) {
      if (p.walkable && !p.solidSides) continue;
      if (p.blocks(px - 4, py - 5, px + 4, py)) return `prop ${p.baseLook ?? p.sprite?.name ?? '?'}${p.character ? `(${p.character})` : ''} at ${p.x / T},${p.y / T}`;
    }
    return null;
  };
  // What the camera is on: null follows the player.
  let focus = null;
  let textTop = false;
  const camera = (pt) => {
    const cx = clamp((pt.x + 0.5) * T - VIEW_W / 2, room.pixelWidth, VIEW_W);
    const cy = clamp((pt.y + 1) * T + CAMERA_OFFSET_Y - VIEW_H / 2, room.pixelHeight, VIEW_H);
    return { x: cx, y: cy };
  };
  const visible = (cam, p) => (p.x + 0.5) * T > cam.x + 6 && (p.x + 0.5) * T < cam.x + VIEW_W - 6 && (p.y + 1) * T > cam.y + 20 && (p.y + 1) * T < cam.y + VIEW_H + 4;
  const bodyPos = (who) => (!who || who === 'player' ? player : pos.get(who));
  let walkSeconds = 0;
  let waitSeconds = 0;
  let says = 0;
  const events = [];
  scene.steps.forEach((s, i) => {
    const tag = `step ${i} (${s.do}${s.who ? ` ${s.who}` : ''})`;
    if (s.do === 'walk') {
      const from = bodyPos(s.who);
      const speed = s.pace ?? ((s.who === 'player' || !s.who ? 70 : 48) * (s.fast ? 2 : 1));
      if (from) {
        const dist = Math.hypot(s.to.x - from.x, s.to.y - from.y) * T;
        if (s.wait !== false) walkSeconds += dist / speed;
        const n = Math.max(1, Math.ceil(dist / 4));
        const seen = new Set();
        const isFlat = (scene.actors ?? []).find((a) => a.id === s.who)?.flat;
        const noClip = isFlat || (scene.actors ?? []).find((a) => a.id === s.who)?.centered || (scene.actors ?? []).find((a) => a.id === s.who)?.look?.startsWith('anim:') || (scene.actors ?? []).find((a) => a.id === s.who)?.look?.startsWith('proc:');
        for (let k = 1; k <= n && !noClip; k++) {
          const x = from.x + (s.to.x - from.x) * (k / n);
          const y = from.y + (s.to.y - from.y) * (k / n);
          const why = blockedBy(x, y);
          if (why && !seen.has(why)) { seen.add(why); problems.push(`${tag}: ${s.who ?? 'player'} walks into ${why} on the way ${from.x},${from.y} -> ${s.to.x},${s.to.y}`); }
          // Close to someone else standing.
          for (const [id, p] of pos) {
            if (id === s.who || hidden.get(id)) continue;
            const a = (scene.actors ?? []).find((q) => q.id === id);
            if (a?.plays === 'vesper' || a?.plays === 'bramble') continue;
            if (a?.flat || a?.look?.startsWith('anim:finale_pillar') || a?.heldBy) continue;
            if (Math.abs(p.x - x) < 0.55 && Math.abs(p.y - y) < 0.4) {
              const key = `actor ${id}`;
              if (!seen.has(key)) { seen.add(key); problems.push(`${tag}: ${s.who ?? 'player'} passes through ${id} standing at ${p.x},${p.y}`); }
            }
          }
          if (s.who !== 'player' && !(scene.actors ?? []).find((q) => q.id === s.who)?.plays && player && Math.abs(player.x - x) < 0.55 && Math.abs(player.y - y) < 0.4 && !seen.has('player')) { seen.add('player'); problems.push(`${tag}: ${s.who} passes through the player at ${player.x},${player.y}`); }
        }
      }
      const to = { x: s.to.x, y: s.to.y };
      if (!s.who || s.who === 'player') player = to; else pos.set(s.who, to);
      // Ends in the way of something?
      const endWhy = (s.who && s.who !== 'player' && (scene.actors ?? []).find((a) => a.id === s.who)?.look?.startsWith('anim:')) ? null : blockedBy(to.x, to.y);
      if (endWhy) problems.push(`${tag}: ${s.who ?? 'player'} ends inside ${endWhy} at ${to.x},${to.y}`);
    } else if (s.do === 'wait') {
      waitSeconds += s.seconds ?? 0;
    } else if (s.do === 'appear') {
      hidden.set(s.who, false);
      if (s.at) { if (s.who === 'player') player = { ...s.at }; else pos.set(s.who, { ...s.at }); }
      events.push(`${tag} -> ${JSON.stringify(s.at ?? pos.get(s.who))}`);
    } else if (s.do === 'leave') {
      hidden.set(s.who, true);
      const p = bodyPos(s.who);
      events.push(`${tag} from ${p ? `${p.x},${p.y}` : '?'}${s.instant ? ' instant' : ''}`);
    } else if (s.do === 'textbox') {
      textTop = Boolean(s.top);
    } else if (s.do === 'camera') {
      if (!s.to && (!s.who || s.who === 'player')) focus = null;
      else if (s.to) focus = { ...s.to };
      else focus = { follow: s.who };
    } else if (s.do === 'say') {
      says++;
      const who = s.who;
      if (who && who !== 'player') {
        const p = pos.get(who);
        const f = focus ? (focus.follow ? pos.get(focus.follow) : focus) : player;
        if (p && f && hidden.get(who)) problems.push(`${tag}: ${who} talks while hidden`);
        else if (p && f && visible(camera(f), p)) {
          // Behind the text box? It covers the bottom third (or the top, when it's moved).
          const cam = camera(f);
          const foot = (p.y + 1) * T - cam.y;
          const top = s.top ?? textTop;
          if (!top && foot > 162) problems.push(`${tag}: ${who} at ${p.x},${p.y} is hidden behind the text box (feet ${foot.toFixed(0)}px down the screen; camera on ${f.x},${f.y})`);
          if (top && foot < 100) problems.push(`${tag}: ${who} at ${p.x},${p.y} is hidden behind the text box (it's at the top; feet ${foot.toFixed(0)}px)`);
        } else if (p && f && !visible(camera(f), p)) problems.push(`${tag}: ${who} at ${p.x},${p.y} is off screen (camera on ${f.x},${f.y}): "${String(s.text).slice(0, 30)}"`);
      }
    }
  });
  // Actors that start on top of room props (duplicates).
  for (const a of scene.actors ?? []) {
    if (a.plays || a.hidden || a.flat || a.look?.startsWith('anim:') || a.look?.startsWith('proc:')) continue;
    const p0 = { x: a.x, y: a.y };
    const px = (p0.x + 0.5) * T;
    const py = (p0.y + 1) * T - 1;
    for (const p of propsNow()) {
      if (p.walkable || !p.character) continue;
      if (p.overlaps(px - 6, py - 8, px + 6, py)) problems.push(`actor ${a.id} starts on top of room prop ${p.baseLook ?? ''}(${p.character}) at ${p.x / T},${p.y / T}`);
    }
  }
  const sayIdx = [];
  scene.steps.forEach((st, i) => { if (st.do === 'say') sayIdx.push(i); });
  const picks = [];
  if (sayIdx.length) {
    const n = Math.min(4, sayIdx.length);
    for (let k = 0; k < n; k++) picks.push(sayIdx[Math.round((k * (sayIdx.length - 1)) / Math.max(1, n - 1))]);
  }
  return { picks: [...new Set(picks)], problems, walkSeconds, waitSeconds, says, events, trig };
}

out('LINT START');
// Names the scenes use that don't exist.
for (const id of CH4) {
  const sc = SCENES[id];
  if (!sc) continue;
  const bad = [];
  for (const a of sc.actors ?? []) {
    const [kind, name] = String(a.look).split(':');
    if (kind === 'anim' && !ANIMATION_NAMES.includes(name)) bad.push(`actor ${a.id} look anim:${name}`);
    if (kind === 'prop' && !PROP_SPRITES[name]) bad.push(`actor ${a.id} look prop:${name}`);
    if (a.animation && !ANIMATION_NAMES.includes(a.animation)) bad.push(`actor ${a.id} animation ${a.animation}`);
    if (a.portrait && !PORTRAITS[a.portrait]) bad.push(`actor ${a.id} portrait ${a.portrait}`);
  }
  sc.steps.forEach((st, i) => {
    if (st.do === 'animate' && st.animation && !ANIMATION_NAMES.includes(st.animation)) bad.push(`step ${i} animation ${st.animation}`);
    if (st.do === 'act' && !(st.act in ACTS)) bad.push(`step ${i} act ${st.act}`);
    if (st.do === 'sound' && st.name && !SOUND_NAMES.includes(st.name)) bad.push(`step ${i} sound ${st.name}`);
    if (st.do === 'music' && st.song && !SONGS[st.song]) bad.push(`step ${i} song ${st.song}`);
    if (st.do === 'say' && st.who && st.who !== 'player' && !(sc.actors ?? []).some((a) => a.id === st.who)) bad.push(`step ${i} says via unknown actor ${st.who}`);
    if (st.do === 'say') for (const m of String(st.text).matchAll(/\{(\w+)\}/g)) {
      const who = (sc.actors ?? []).find((a) => a.id === st.who);
      const art = PORTRAITS[st.face ? who?.portrait : who?.portrait];
      if (who?.portrait && art && !Object.keys(art.expressions ?? {}).includes(m[1]) && m[1] !== 'base') bad.push(`step ${i} face {${m[1]}} not in ${who.portrait}`);
    }
  });
  if (bad.length) out(`NAMES ${id}: ${bad.join('; ')}`);
}
for (const id of CH4) {
  await new Promise((done) => setTimeout(done, 0));
  const scene = SCENES[id];
  if (!scene) { if (!['glowwormUmbrella'].includes(id)) out(`MISSING scene ${id}`); continue; }
  for (const mode of ['early', 'late']) {
    let r;
    try { r = lintScene(scene, mode); } catch (e) { out(`${id} [${mode}]: LINT ERROR ${e.stack}`); continue; }
    if (mode === 'early') out(`== ${id} (${scene.room}) trigger=${r.trig ? JSON.stringify(r.trig) : 'none'} says=${r.says} walk=${r.walkSeconds.toFixed(0)}s wait=${r.waitSeconds.toFixed(0)}s`);
    if (mode === 'early') out(`   PICKS ${r.picks.join(',')}`);
    if (mode === 'early') for (const e of r.events) out(`   i ${e}`);
    for (const p of r.problems) out(`   [${mode}] ${p}`);
    // And from the far ends of the trigger: the walks in from there.
    if (params.get('ends') && mode === 'early' && r.trig && (r.trig.w > 1 || r.trig.h > 1)) {
      for (const [label, at] of [['first tile', { x: r.trig.x, y: r.trig.y }], ['last tile', { x: r.trig.x + r.trig.w - 1, y: r.trig.y + r.trig.h - 1 }]]) {
        const r2 = lintScene(scene, mode, at);
        const mine = new Set(r.problems);
        for (const p of r2.problems) if (!mine.has(p)) out(`   [from ${label} ${at.x},${at.y}] ${p}`);
      }
    }
  }
}

// Triggers that can be walked around, per room: from each door's arrival
// spot, which other doors can be reached without stepping on the trigger.
out('--- TRIGGER BYPASS ---');
function passable(room, tx, ty) {
  if (room.isSolidTile(tx, ty)) return false;
  const px = tx * T;
  const py = ty * T;
  return !room.props.some((p) => !(p.walkable && !p.solidSides) && p.blocks(px + 4, py + 9, px + 12, py + 16));
}
function reach(room, from, banned) {
  const seen = new Set([`${from.x},${from.y}`]);
  const queue = [from];
  while (queue.length) {
    const { x, y } = queue.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx;
      const ny = y + dy;
      const key = `${nx},${ny}`;
      if (seen.has(key) || banned.has(key) || !passable(room, nx, ny)) continue;
      seen.add(key);
      queue.push({ x: nx, y: ny });
    }
  }
  return seen;
}
for (const [id, data] of Object.entries(ROOMS)) {
  const triggers = (data.cutscenes ?? []).filter((c) => CH4.includes(c.scene) && !c.nudge);
  if (!triggers.length) continue;
  setSeen(CH4);
  const room = new Room(data);
  for (const t of triggers) {
    setSeen(t.after ? [t.after] : []);
    const r = new Room(data);
    const banned = new Set();
    for (let x = t.x; x < t.x + t.w; x++) for (let y = t.y; y < t.y + t.h; y++) banned.add(`${x},${y}`);
    const spots = [];
    // Arrival spots: other rooms' doors that lead here, and the room's own start.
    for (const [oid, od] of Object.entries(ROOMS)) for (const d of od.doors ?? []) if (d.to === id) spots.push({ name: `from ${oid}`, ...d.spawn });
    // Exits: this room's doors.
    const exits = (data.doors ?? []).map((d) => ({ name: `door to ${d.to}`, x: d.x, y: d.y }));
    for (const s of spots) {
      if (banned.has(`${s.x},${s.y}`)) continue;
      const open = reach(r, s, banned);
      const free = exits.filter((e) => open.has(`${e.x},${e.y}`) || [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => open.has(`${e.x + dx},${e.y + dy}`)));
      if (free.length) out(`${id}: ${t.scene} (${JSON.stringify({ x: t.x, y: t.y, w: t.w, h: t.h })}): arriving ${s.name} at ${s.x},${s.y} can reach without it: ${free.map((e) => e.name).join(', ')}`);
    }
  }
}
out('LINT DONE');
</script>
</body>
</html>
