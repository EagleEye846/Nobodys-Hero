<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><style>body{background:#000;margin:0;color:#fff;font:12px monospace}canvas{display:block;image-rendering:pixelated}#report{white-space:pre}</style></head>
<body><canvas id="game" width="640" height="480"></canvas><div id="report"></div>
<script type="module">
// Lazy player: for every attack, tries standing still at spots across the box,
// holding one way into a wall or corner, and strafing along an edge. An attack
// that one of these gets through with (almost) no hits has a safe spot.
// Run with
//   python tools/headless.py "http://localhost:8000/tools/cheeseCheck.html?enemy=olm&trials=6" 600
// (?patterns=a,b for some of them, ?phase=N for a boss's later phases).
// CHEESE: a lazy way takes under half a hit a turn. weak: under one. Pair it
// with dodgeCheck.html, so a fix doesn't make an attack unfair.
import { UI_WIDTH, UI_HEIGHT } from './src/config.js';
import { createScreen } from './src/engine/screen.js';
import { loadTextFiles } from './src/engine/textLoader.js';
import { loadUiFont } from './src/ui/text.js';
import { TEXT_FILES } from './src/data/textManifest.js';
const report = document.getElementById('report');
try {
const params = new URLSearchParams(location.search);
let seed = Number(params.get('seed') ?? 1);
Math.random = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
createScreen(document.getElementById('game'), UI_WIDTH, UI_HEIGHT);
await Promise.all([loadUiFont(), loadTextFiles(TEXT_FILES)]);
const { BattleScene } = await import('./src/battle/battleScene.js');
const { ENEMIES } = await import('./src/data/enemies/index.js');
const { joinParty } = await import('./src/characters/party.js');
const hud = await import('./src/battle/hud.js');
if (params.get('ves') !== '0') joinParty('vesper');
const battle = new BattleScene([ENEMIES[params.get('enemy')]], () => {}, params.get('area') ?? 'below');
const foe = battle.phased ?? battle.activeFoes()[0];
const phaseIx = Number(params.get('phase') ?? 0);
for (let i = 1; i <= phaseIx; i++) battle.enterPhase(foe, i);
battle.stageFx?.skip?.(battle, foe);
let patterns = (params.get('patterns') ?? '').split(',').filter(Boolean);
if (!patterns.length) {
  const ph = battle.bossPhase?.(foe);
  patterns = (ph?.patterns ?? foe.data.patterns).map((p) => (typeof p === 'string' ? p : p.name));
}
const trials = Number(params.get('trials') ?? 3);
const B = hud.BOX;
const strategies = [];
for (const fx of [0.08, 0.3, 0.5, 0.7, 0.92]) for (const fy of [0.08, 0.5, 0.92]) strategies.push({ name: `still ${fx},${fy}`, fx, fy });
const D = { U: ['up'], D: ['down'], L: ['left'], R: ['right'], UL: ['up', 'left'], UR: ['up', 'right'], DL: ['down', 'left'], DR: ['down', 'right'] };
for (const k of Object.keys(D)) strategies.push({ name: `hold ${k}`, keys: () => D[k] });
for (const edge of ['down', 'up']) strategies.push({ name: `strafe ${edge}`, keys: (t) => [edge, Math.floor(t / 0.9) % 2 ? 'left' : 'right'] });
for (const edge of ['left', 'right']) strategies.push({ name: `strafe ${edge}`, keys: (t) => [edge, Math.floor(t / 0.9) % 2 ? 'up' : 'down'] });
strategies.push({ name: 'circle', keys: (t) => [['right'], ['down'], ['left'], ['up']][Math.floor(t / 0.8) % 4] });
const lines = [];
for (const name of patterns) {
  const results = [];
  for (const s of strategies) {
    let hits = 0;
    let len = 0;
    for (let trial = 0; trial < trials; trial++) {
      battle.hero.hp = battle.hero.maxHp = 99999;
      for (const m of battle.party ?? []) { m.hp = m.maxHp = 99999; }
      battle.attackers = [foe];
      battle.pickPattern = () => name;
      battle.phase = 'dodge';
      battle.phaseTime = 0;
      battle.startAttack();
      if (s.fx !== undefined) { battle.soul.x = B.x + B.w * s.fx; battle.soul.y = B.y + B.h * s.fy; }
      const realHurt = battle.hurt.bind(battle);
      battle.hurt = (bullet) => { if (battle.soul.iframes > 0 || battle.soul.untouchable > 0) return; hits++; realHurt(bullet); };
      const held = new Set();
      const input = { isDown: (k) => held.has(k), wasPressed: () => false, endFrame() {} };
      let f = 0;
      while (battle.phase === 'dodge' && f < 60 * 16) {
        f++;
        held.clear();
        if (s.keys) for (const k of s.keys(f / 60)) held.add(k);
        battle.update(1 / 60, input);
      }
      len += f / 60;
      battle.hurt = realHurt;
      if (battle.phase !== 'dodge') battle.bullets = [];
    }
    results.push({ s: s.name, hits: hits / trials, len: len / trials });
  }
  results.sort((a, b) => a.hits - b.hits);
  const best = results[0];
  const safe = results.filter((r) => r.hits < 0.5).map((r) => r.s);
  lines.push(`${best.hits < 0.5 ? 'CHEESE' : best.hits < 1.01 ? 'weak  ' : 'ok    '} ${name}: best ${best.s} ${best.hits.toFixed(2)} hits (turn ${best.len.toFixed(1)}s); median ${results[Math.floor(results.length / 2)].hits.toFixed(2)}${safe.length ? '  safe: ' + safe.join(' | ') : ''}`);
}
report.textContent = `${params.get('enemy')} phase ${phaseIx}\n${lines.join('\n')}\nBOT DONE`;
} catch (e) { report.textContent = 'ERROR ' + e.stack + '\nBOT DONE'; }
</script></body></html>
